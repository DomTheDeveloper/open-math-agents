name: Prepare independent inputs for the full conditional Sun theorem
on:
  push:
    branches: [audit/sun-a038098-cubes]
    paths: ['.github/workflows/a038098-lean436.yml']
permissions:
  contents: read
concurrency:
  group: a038098-full-inputs
  cancel-in-progress: true
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        input: [cube-certificates, prior-finite-checks]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DomTheDeveloper/formal-conjectures
          ref: 0e13442afa3ae06a468dbf57d6bd6c730f712ba0
          path: proof
          persist-credentials: false
          sparse-checkout: A038098
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: senamakel/conjectures-lean
          ref: f34a5482921096c7f0a7c40e43aca1dc21987635
          persist-credentials: false
          path: upstream
          sparse-checkout: |
            conjectures/schoenfeld-rh
            conjectures/erdos-985
      - name: Install Lean
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the upstream pinned Mathlib
        working-directory: upstream/conjectures/schoenfeld-rh
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: 1
        run: |
          df -h .
          lake exe cache get Mathlib
          df -h .
      - name: Restore checked external modules
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            upstream/conjectures/schoenfeld-rh/.lake/build
            upstream/conjectures/erdos-985/.lake/build
          key: a038098-schoenfeld-f34a54829210-linux-436-v1
      - name: Replay the unconditional cube certificates on Lean 4.36
        if: matrix.input == 'cube-certificates'
        working-directory: upstream/conjectures/schoenfeld-rh
        run: |
          set -eo pipefail
          cp -R "$GITHUB_WORKSPACE/proof/A038098" .
          mkdir -p .lake/build/lib/lean/A038098/Certificate
          for mod in Sieve Wide Trial; do
            lake env lean -o ".lake/build/lib/lean/A038098/$mod.olean" "A038098/$mod.lean"
          done
          python3 A038098/generate_packed.py
          while IFS= read -r file; do
            echo "Checking $file"
            lake env lean -j1 --tstack=65536 -o ".lake/build/lib/lean/${file%.lean}.olean" "$file"
          done < A038098/Certificate/modules.txt
          lake env lean -j1 --tstack=65536 -o .lake/build/lib/lean/A038098/PackedCases.olean A038098/PackedCases.lean
          lake env lean -j1 --tstack=65536 -o .lake/build/lib/lean/A038098/Cases.olean A038098/Cases.lean | tee "$RUNNER_TEMP/small.log"
          grep -F 'Sun.CubeSieve.cubes_two_to_two_hundred' "$RUNNER_TEMP/small.log"
          if grep -E 'sorryAx|native_decide|ofReduceBool|trustCompiler' "$RUNNER_TEMP/small.log"; then exit 1; fi
      - name: Save checked small cubes for the combined proof
        if: matrix.input == 'cube-certificates'
        uses: actions/cache/save@v4
        with:
          path: upstream/conjectures/schoenfeld-rh/.lake/build/lib/lean/A038098
          key: a038098-small436-0e13442afa3a-v1
      - name: Build the earlier theorem's independent finite checks
        if: matrix.input == 'prior-finite-checks'
        working-directory: upstream/conjectures/schoenfeld-rh
        run: |
          set -eu
          for i in $(seq -w 0 19); do
            lake build "+Schoenfeld.PsiCert.Chunks.C$i:olean"
          done
          lake build +Schoenfeld.WithRosser:olean +Schoenfeld.Check.Pi:olean
      - name: Save the earlier numerical lemmas separately
        if: matrix.input == 'prior-finite-checks'
        uses: actions/cache/save@v4
        with:
          path: upstream/conjectures/schoenfeld-rh/.lake/build/lib/lean/Schoenfeld
          key: a038098-prior-finite-f34a54829210-v1
