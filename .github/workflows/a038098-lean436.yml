name: Check Sun cubes through 2153 with the finite psi certificate
on:
  push:
    branches: [audit/sun-a038098-cubes]
    paths: ['.github/workflows/a038098-lean436.yml']
permissions:
  contents: read
concurrency:
  group: a038098-finite-link
  cancel-in-progress: true
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DomTheDeveloper/formal-conjectures
          ref: 01f4f642210f5ea19d954bb1c74fee20d32d112f
          path: proof
          persist-credentials: false
          sparse-checkout: A038098
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: senamakel/conjectures-lean
          ref: f34a5482921096c7f0a7c40e43aca1dc21987635
          persist-credentials: false
          path: upstream
          sparse-checkout: |
            conjectures/schoenfeld-rh
            conjectures/erdos-985
      - name: Install Lean
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the upstream pinned Mathlib
        working-directory: upstream/conjectures/schoenfeld-rh
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: 1
        run: |
          df -h .
          lake exe cache get Mathlib
          df -h .
      - name: Restore checked external modules
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            upstream/conjectures/schoenfeld-rh/.lake/build
            upstream/conjectures/erdos-985/.lake/build
          key: a038098-schoenfeld-f34a54829210-linux-436-v1
      - name: Restore the independently rebuilt earlier finite checks
        uses: actions/cache/restore@v4
        with:
          path: upstream/conjectures/schoenfeld-rh/.lake/build/lib/lean/Schoenfeld
          key: a038098-prior-finite-f34a54829210-v1
          fail-on-cache-miss: true
      - name: Check the finite cube range and print the full dependency list
        working-directory: upstream/conjectures/schoenfeld-rh
        run: |
          set -eo pipefail
          cp -R "$GITHUB_WORKSPACE/proof/A038098" .
          mkdir -p .lake/build/lib/lean/A038098/External
          for mod in Analytic Envelope FiniteEnvelope; do
            lake env lean -o ".lake/build/lib/lean/A038098/$mod.olean" "A038098/$mod.lean"
          done
          lake env lean -o .lake/build/lib/lean/A038098/External/Small.olean A038098/External/Small.lean | tee "$RUNNER_TEMP/short.log"
          grep -F 'Sun.CubeBridge.cubes_200_to_2153_checked' "$RUNNER_TEMP/short.log"
          if grep -E 'sorryAx|ofReduceBool|trustCompiler' "$RUNNER_TEMP/short.log"; then exit 1; fi
